<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商家中心 - 陈鸿外卖</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif; background: #f0f2f5; color: #1a1a2e; }
        .login-page { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg,#FF8C00,#FF6B00); position: relative; }
        .login-page::before { content: ''; position: absolute; inset: 0; background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E"); opacity: 0.4; }
        .login-box { background: #fff; padding: 44px 40px; border-radius: 16px; width: 380px; box-shadow: 0 20px 60px rgba(0,0,0,.2); position: relative; z-index: 1; }
        .login-box h1 { font-size: 24px; text-align: center; margin-bottom: 4px; background: linear-gradient(135deg,#FF8C00,#FF6B00); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .login-box p { text-align: center; color: #999; font-size: 13px; margin-bottom: 28px; }
        .login-box input { width: 100%; padding: 12px 16px; border: 1.5px solid #e8e8e8; border-radius: 10px; font-size: 14px; margin-bottom: 14px; outline: none; transition: border-color .2s; }
        .login-box input:focus { border-color: #FF8C00; box-shadow: 0 0 0 3px rgba(255,140,0,.1); }
        .login-box button { width: 100%; padding: 13px; background: linear-gradient(135deg,#FF8C00,#FF6B00); color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: transform .2s, box-shadow .2s; }
        .login-box button:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(255,140,0,.35); }
        .login-box .error { color: #ff4444; font-size: 13px; text-align: center; margin-top: 10px; }
        .login-box .back-link { display: block; text-align: center; margin-top: 16px; font-size: 13px; color: #999; text-decoration: none; transition: color .2s; }
        .login-box .back-link:hover { color: #FF8C00; }

        .layout { display: flex; min-height: 100vh; }
        .sidebar { width: 220px; background: #1a1a2e; color: #fff; padding: 0; flex-shrink: 0; display: flex; flex-direction: column; }
        .sidebar-header { padding: 24px 24px 20px; border-bottom: 1px solid rgba(255,255,255,.06); }
        .sidebar-header h2 { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
        .sidebar-header small { font-size: 11px; color: rgba(255,255,255,.35); }
        .sidebar-nav { padding: 12px 0; flex: 1; }
        .sidebar a { display: flex; align-items: center; gap: 10px; padding: 12px 24px; color: rgba(255,255,255,.6); text-decoration: none; font-size: 14px; cursor: pointer; transition: all .2s; border-left: 3px solid transparent; }
        .sidebar a:hover { color: #fff; background: rgba(255,255,255,.04); }
        .sidebar a.active { color: #FF8C00; background: rgba(255,140,0,.08); border-left-color: #FF8C00; font-weight: 600; }
        .main { flex: 1; padding: 28px 32px; overflow-y: auto; }
        .main h1 { font-size: 22px; margin-bottom: 20px; font-weight: 700; }
        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #e8e8e8; }
        .topbar .user { font-size: 13px; color: #999; }
        .topbar .logout { color: #FF8C00; cursor: pointer; font-size: 13px; text-decoration: none; font-weight: 500; }
        .topbar .logout:hover { text-decoration: underline; }

        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px; }
        .stat-card { background: #fff; padding: 22px 24px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.04); border: 1px solid rgba(0,0,0,.04); transition: transform .2s, box-shadow .2s; }
        .stat-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.08); }
        .stat-card .num { font-size: 30px; font-weight: 800; background: linear-gradient(135deg,#FF8C00,#FF6B00); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .stat-card .label { font-size: 12px; color: #999; margin-top: 6px; font-weight: 500; }

        .card { background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.04); margin-bottom: 20px; border: 1px solid rgba(0,0,0,.04); overflow: hidden; }
        .card-header { padding: 18px 24px; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center; }
        .card-header h3 { font-size: 15px; font-weight: 600; }

        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 14px 20px; text-align: left; border-bottom: 1px solid #f5f5f5; }
        th { background: #fafafa; font-weight: 600; color: #888; font-size: 12px; text-transform: uppercase; letter-spacing: .3px; }
        tr:hover td { background: #fafafa; }
        tr:last-child td { border-bottom: none; }

        .btn { display: inline-block; padding: 7px 16px; border: none; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all .2s; }
        .btn-primary { background: #FF8C00; color: #fff; }
        .btn-primary:hover { background: #e67e00; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(255,140,0,.3); }
        .btn-danger { background: #ff4444; color: #fff; }
        .btn-danger:hover { background: #cc0000; }
        .btn-sm { padding: 5px 12px; font-size: 11px; }
        .btn-outline { background: #fff; border: 1.5px solid #ddd; color: #666; }
        .btn-outline:hover { border-color: #FF8C00; color: #FF8C00; background: #FFF8F0; }

        .status-tag { display: inline-block; padding: 3px 10px; border-radius: 6px; font-size: 11px; font-weight: 500; }
        .status-pending { background: #FFF3E0; color: #E65100; }
        .status-confirmed { background: #E3F2FD; color: #1565C0; }
        .status-preparing { background: #F3E5F5; color: #7B1FA2; }
        .status-delivering { background: #E8F5E9; color: #2E7D32; }
        .status-delivered { background: #F5F5F5; color: #888; }
        .status-cancelled { background: #FFEBEE; color: #C62828; }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 12px; color: #888; margin-bottom: 6px; font-weight: 500; text-transform: uppercase; letter-spacing: .3px; }
        .form-group input { width: 100%; padding: 10px 14px; border: 1.5px solid #e8e8e8; border-radius: 8px; font-size: 13px; outline: none; transition: border-color .2s; }
        .form-group input:focus { border-color: #FF8C00; box-shadow: 0 0 0 3px rgba(255,140,0,.08); }
        .form-row { display: flex; gap: 16px; }
        .form-row .form-group { flex: 1; }

        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,26,46,.5); backdrop-filter: blur(4px); z-index: 1000; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal { background: #fff; border-radius: 16px; padding: 28px 32px; width: 440px; max-width: 90vw; max-height: 80vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.2); animation: modalIn .25s ease; }
        @keyframes modalIn { from { transform: translateY(20px) scale(.96); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }
        .modal h3 { font-size: 17px; margin-bottom: 20px; }

        .empty { text-align: center; padding: 48px 20px; color: #bbb; font-size: 14px; }
        .section { display: none; }
        .section.active { display: block; }

        .restaurant-info { padding: 24px; display: flex; gap: 20px; align-items: center; }
        .restaurant-info .avatar { width: 68px; height: 68px; border-radius: 14px; background: linear-gradient(135deg,#fff5e6,#ffe0b2); display: flex; align-items: center; justify-content: center; font-size: 30px; box-shadow: 0 4px 12px rgba(255,140,0,.15); }
        .restaurant-info .info h2 { font-size: 20px; margin-bottom: 4px; }
        .restaurant-info .info p { font-size: 12px; color: #999; }
        .status-active { display: inline-block; padding: 3px 12px; background: #E8F5E9; color: #2E7D32; border-radius: 20px; font-size: 11px; font-weight: 600; margin-top: 6px; }
    </style>
</head>
<body>
<div id="merchantApp">
    <!-- Login -->
    <div class="login-page" id="merchantLogin">
        <div class="login-box">
            <h1>🏪 商家中心</h1>
            <p>陈鸿外卖 · 商家登录</p>
            <input type="text" id="mLoginUser" placeholder="商家账号" autocomplete="off">
            <input type="password" id="mLoginPass" placeholder="密码">
            <button onclick="merchantLogin()">登录</button>
            <p class="error" id="mLoginError"></p>
            <a href="/delivery" class="back-link">← 返回外卖首页</a>
        </div>
    </div>

    <!-- Dashboard -->
    <div class="layout" id="merchantDashboard" style="display:none;">
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>🏪 商家中心</h2>
                <small>陈鸿外卖 · 商家端</small>
            </div>
            <div class="sidebar-nav">
                <a class="active" onclick="switchSection('dashboard')">📊 数据概览</a>
                <a onclick="switchSection('orders')">📋 订单管理</a>
                <a onclick="switchSection('menu')">🍽️ 菜品管理</a>
                <a onclick="switchSection('settings')">⚙️ 店铺设置</a>
            </div>
        </div>
        <div class="main">
            <div class="topbar">
                <span></span>
                <div><span class="user" id="mUserDisplay"></span> <a class="logout" onclick="merchantLogout()">退出</a></div>
            </div>

            <!-- Dashboard -->
            <div class="section active" id="sec-dashboard">
                <h1>📊 数据概览</h1>
                <div class="stats">
                    <div class="stat-card"><div class="num" id="todayOrders">0</div><div class="label">今日订单</div></div>
                    <div class="stat-card"><div class="num" id="todayRevenue">¥0</div><div class="label">今日收入</div></div>
                    <div class="stat-card"><div class="num" id="totalOrders">0</div><div class="label">总订单</div></div>
                    <div class="stat-card"><div class="num" id="totalRevenue">¥0</div><div class="label">总收入</div></div>
                </div>
            </div>

            <!-- Orders -->
            <div class="section" id="sec-orders">
                <h1>📋 订单管理</h1>
                <div class="card"><div id="merchantOrderList"></div></div>
            </div>

            <!-- Menu -->
            <div class="section" id="sec-menu">
                <h1>🍽️ 菜品管理</h1>
                <div class="card">
                    <div class="card-header"><h3>菜品列表</h3><button class="btn btn-primary" onclick="showAddItem()">+ 添加菜品</button></div>
                    <div id="menuItemList"></div>
                </div>
            </div>

            <!-- Settings -->
            <div class="section" id="sec-settings">
                <h1>⚙️ 店铺设置</h1>
                <div class="card" id="settingsCard"></div>
            </div>
        </div>
    </div>
</div>

<!-- Add/Edit Item Modal -->
<div class="modal-overlay" id="itemModal">
    <div class="modal">
        <h3 id="itemModalTitle">添加菜品</h3>
        <div class="form-group"><label>菜品名称</label><input id="itemName" placeholder="例：招牌牛肉饭"></div>
        <div class="form-group"><label>价格 (¥)</label><input id="itemPrice" type="number" step="0.01" placeholder="例：28.00"></div>
        <button class="btn btn-primary" onclick="saveItem()">保存</button>
        <button class="btn btn-outline" onclick="closeItemModal()" style="margin-left:8px;">取消</button>
    </div>
</div>

<script>
const API = 'http://localhost:3000/api';
let merchantToken = localStorage.getItem('merchantToken') || null;
let merchantData = null;
let editItemId = null;

function mHeaders() { return { 'Content-Type': 'application/json', ...(merchantToken ? { 'Authorization': merchantToken } : {}) }; }

async function mApi(path, opts = {}) {
    const res = await fetch(`${API}${path}`, { headers: mHeaders(), ...opts });
    const json = await res.json();
    if (!json.success) throw new Error(json.message || '请求失败');
    return json.data;
}

async function merchantLogin() {
    const username = document.getElementById('mLoginUser').value.trim();
    const password = document.getElementById('mLoginPass').value.trim();
    document.getElementById('mLoginError').textContent = '';
    if (!username || !password) { document.getElementById('mLoginError').textContent = '请输入账号和密码'; return; }
    try {
        const data = await mApi('/merchant/auth/login', { method: 'POST', body: JSON.stringify({ username, password }) });
        merchantToken = data.token;
        localStorage.setItem('merchantToken', merchantToken);
        await loadMerchantDashboard();
    } catch (e) {
        document.getElementById('mLoginError').textContent = e.message;
    }
}

async function loadMerchantDashboard() {
    document.getElementById('merchantLogin').style.display = 'none';
    document.getElementById('merchantDashboard').style.display = '';
    document.getElementById('mUserDisplay').textContent = `欢迎, ${localStorage.getItem('merchantUser') || ''}`;
    await loadStats();
    await loadOrders();
    await loadMenu();
    await loadSettings();
    switchSection('dashboard');
}

async function loadStats() {
    try {
        const s = await mApi('/merchant/stats');
        document.getElementById('todayOrders').textContent = s.todayOrders;
        document.getElementById('todayRevenue').textContent = `¥${Number(s.todayRevenue).toFixed(2)}`;
        document.getElementById('totalOrders').textContent = s.totalOrders;
        document.getElementById('totalRevenue').textContent = `¥${Number(s.totalRevenue).toFixed(2)}`;
    } catch {}
}

async function loadOrders() {
    const el = document.getElementById('merchantOrderList');
    try {
        const orders = await mApi('/merchant/orders');
        if (orders.length === 0) { el.innerHTML = '<div class="empty">暂无订单</div>'; return; }
        el.innerHTML = '<table><thead><tr><th>订单号</th><th>顾客</th><th>商品</th><th>金额</th><th>时间</th><th>状态</th><th>操作</th></tr></thead><tbody>' +
            orders.map(o => {
                const items = (o.items || []).map(i => `${i.item_name}x${i.quantity}`).join(', ');
                const statusClass = `status-${o.status}`;
                const statusText = STATUS_MAP[o.status] || o.status;
                const actions = getOrderActions(o.status, o.id);
                return `<tr><td>#${o.id}</td><td>${o.customer_name}</td><td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${items}</td><td>¥${o.total_price}</td><td>${o.created_at}</td><td><span class="status-tag ${statusClass}">${statusText}</span></td><td>${actions}</td></tr>`;
            }).join('') + '</tbody></table>';
    } catch { el.innerHTML = '<div class="empty">加载失败</div>'; }
}

function getOrderActions(status, id) {
    const map = { 'pending': 'confirmed', 'confirmed': 'preparing', 'preparing': 'delivering', 'delivering': 'delivered' };
    const next = map[status];
    if (!next) return '<span style="color:#999;font-size:12px;">已完成</span>';
    return `<button class="btn btn-primary btn-sm" onclick="updateOrderStatus(${id},'${next}')">${STATUS_MAP[next]}</button>`;
}

async function updateOrderStatus(id, status) {
    try {
        await mApi(`/merchant/orders/${id}/status`, { method: 'PATCH', body: JSON.stringify({ status }) });
        await loadOrders();
        await loadStats();
    } catch (e) { alert(e.message); }
}

async function loadMenu() {
    const el = document.getElementById('menuItemList');
    try {
        const r = await mApi('/merchant/restaurant');
        const items = r.items || [];
        if (items.length === 0) { el.innerHTML = '<div class="empty">暂无菜品，点击右上角添加</div>'; return; }
        el.innerHTML = '<table><thead><tr><th>菜品名</th><th>价格</th><th>操作</th></tr></thead><tbody>' +
            items.map(i => `<tr><td>${i.name}</td><td>¥${i.price}</td><td><button class="btn btn-sm btn-outline" onclick="editItem(${i.id},'${i.name}',${i.price})">编辑</button> <button class="btn btn-sm btn-danger" onclick="deleteItem(${i.id})">删除</button></td></tr>`).join('') +
            '</tbody></table>';
    } catch { el.innerHTML = '<div class="empty">加载失败</div>'; }
}

function showAddItem() { editItemId = null; document.getElementById('itemModalTitle').textContent = '添加菜品'; document.getElementById('itemName').value = ''; document.getElementById('itemPrice').value = ''; document.getElementById('itemModal').classList.add('active'); }
function closeItemModal() { document.getElementById('itemModal').classList.remove('active'); }
function editItem(id, name, price) { editItemId = id; document.getElementById('itemModalTitle').textContent = '编辑菜品'; document.getElementById('itemName').value = name; document.getElementById('itemPrice').value = price; document.getElementById('itemModal').classList.add('active'); }

async function saveItem() {
    const name = document.getElementById('itemName').value.trim();
    const price = parseFloat(document.getElementById('itemPrice').value);
    if (!name || !price) { alert('请填写完整信息'); return; }
    try {
        if (editItemId) {
            await mApi(`/merchant/menu-items/${editItemId}`, { method: 'PUT', body: JSON.stringify({ name, price }) });
        } else {
            await mApi('/merchant/menu-items', { method: 'POST', body: JSON.stringify({ name, price }) });
        }
        closeItemModal();
        await loadMenu();
    } catch (e) { alert(e.message); }
}

async function deleteItem(id) {
    if (!confirm('确认删除该菜品？')) return;
    try {
        await mApi(`/merchant/menu-items/${id}`, { method: 'DELETE' });
        await loadMenu();
    } catch (e) { alert(e.message); }
}

async function loadSettings() {
    const el = document.getElementById('settingsCard');
    try {
        const r = await mApi('/merchant/restaurant');
        el.innerHTML = `
            <div class="restaurant-info">
                <div class="avatar">🍽️</div>
                <div class="info">
                    <h2>${r.name}</h2>
                    <p>★ ${r.rating} · 月售${r.monthly_sales} · ${r.city}</p>
                    <span class="status-active">● 营业中</span>
                </div>
            </div>
            <div style="padding:0 20px 20px;">
                <div class="form-row">
                    <div class="form-group"><label>店铺名称</label><input id="sName" value="${r.name}"></div>
                    <div class="form-group"><label>配送时间</label><input id="sTime" value="${r.delivery_time}"></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>起送价</label><input id="sMinOrder" value="${r.min_order}"></div>
                    <div class="form-group"><label>配送费</label><input id="sFee" value="${r.delivery_fee}"></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>距离</label><input id="sDist" value="${r.distance}"></div>
                    <div class="form-group"><label>标签</label><input id="sBadge" value="${r.badge || ''}"></div>
                </div>
                <button class="btn btn-primary" onclick="saveSettings()">保存设置</button>
            </div>
        `;
    } catch { el.innerHTML = '<div class="empty">加载失败</div>'; }
}

async function saveSettings() {
    try {
        await mApi('/merchant/restaurant', { method: 'PUT', body: JSON.stringify({
            name: document.getElementById('sName').value,
            delivery_time: document.getElementById('sTime').value,
            min_order: document.getElementById('sMinOrder').value,
            delivery_fee: document.getElementById('sFee').value,
            distance: document.getElementById('sDist').value,
            badge: document.getElementById('sBadge').value
        })});
        alert('保存成功');
    } catch (e) { alert(e.message); }
}

function merchantLogout() {
    localStorage.removeItem('merchantToken');
    merchantToken = null;
    document.getElementById('merchantDashboard').style.display = 'none';
    document.getElementById('merchantLogin').style.display = '';
}

function switchSection(name) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.getElementById(`sec-${name}`).classList.add('active');
    document.querySelectorAll('.sidebar a').forEach(a => a.classList.remove('active'));
    document.querySelectorAll('.sidebar a').forEach(a => { if (a.textContent.includes({ dashboard: '数据概览', orders: '订单管理', menu: '菜品管理', settings: '店铺设置' }[name])) a.classList.add('active'); });
    if (name === 'orders') loadOrders();
    if (name === 'menu') loadMenu();
    if (name === 'settings') loadSettings();
    if (name === 'dashboard') loadStats();
}

const STATUS_MAP = { pending: '待确认', confirmed: '已确认', preparing: '准备中', delivering: '配送中', delivered: '已送达', cancelled: '已取消' };

// Auto login
document.addEventListener('DOMContentLoaded', async () => {
    if (merchantToken) {
        try {
            await loadMerchantDashboard();
        } catch {
            localStorage.removeItem('merchantToken');
            merchantToken = null;
        }
    }
});
</script>
</body>
</html>
